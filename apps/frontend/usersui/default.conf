# Only content-hashed filenames may be cached long-term. remoteEntry.mjs and
# mf-manifest.json keep stable names while their content changes every build,
# so a cached copy resolves chunk hashes that no longer exist in the image.
# An absent Cache-Control is not "uncached": browsers fall back to heuristic
# freshness (~10% of Last-Modified age) and skip revalidation entirely.
map $uri $cache_control {
    default                            "no-cache";
    # Quoted because nginx parses an unquoted {n,} as a config block.
    "~*\.[0-9a-f]{16,}\.(js|mjs|css)$" "public, max-age=31536000, immutable";
}

server {
    listen       8080;
    listen  [::]:8080;
    server_name  localhost;

    # Add MIME types for JavaScript and other static files
    include /etc/nginx/mime.types;
    default_type text/plain;

    root /usr/share/nginx/html;

    # nginx discards inherited add_header directives in any context that
    # declares its own, so every header lives here and no location adds one.
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept' always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;

    # Deliberately not "always": an error response must not inherit the
    # immutable lifetime, or a chunk briefly missing mid-deploy would leave
    # clients caching its 404 for a year.
    add_header Cache-Control $cache_control;

    location / {
        index  index.html;
        try_files $uri /index.html;
    }

    # Serve .js and .mjs files with the correct MIME type
    location ~* \.(js|mjs)$ {
        types {
            application/javascript js mjs;  # Serve JS and MJS with the correct MIME type
        }
        try_files $uri =404;
    }

    # A missing asset must 404; the shell fallback would otherwise answer a
    # stale manifest request with index.html and a 200, leaving module
    # federation to fail while parsing HTML as JSON.
    location ~* \.(json|css|map)$ {
        try_files $uri =404;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
    }
}
