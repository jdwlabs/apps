openapi: 3.1.0

info:
  title: profile-service
  version: 1.0.0
  summary: Profiles, addresses and icons, frozen against the usersrole Spring controllers.
  description: |
    The profile half of the usersrole split: 15 operations, all under
    `/api/profiles`.

    Frozen against the behaviour of `ProfilesController` and `ProfileService`,
    not against the springdoc document they publish — springdoc reports every
    handler as `200 */*` and mis-types both icon uploads as `application/json`,
    because it reads return types and parameter types rather than what the
    handlers build and consume. Every status and media type below was
    transcribed from the handler bodies and the `GlobalExceptionHandler`.
    `docs/contracts/README.md` lists every deviation from the served document
    and why it is there, and `scripts/check-contract-drift.mjs` fails the build
    when a deviation appears that is not on that list.

    This service authorizes from the verified token minted by `identity-service`
    and makes no call to it on the request path. That is a change from how the
    JVM authorizes today, not a transcription of it: today every request
    re-reads the principal, its grants and its profile from the database. What
    that change costs is recorded in `x-authority-freshness` and
    `x-profile-id-fallback` rather than left to be discovered.
  license:
    name: PolyForm-Noncommercial-1.0.0
    url: https://polyformproject.org/licenses/noncommercial/1.0.0/

servers:
  - url: '{AUTH_BASE_URL}'
    description: |
      The same hostname `identity-service` serves. The frontends build every URL
      as `${AUTH_BASE_URL}/api/...`, so the split is routed by path prefix and no
      client changes at cutover.
    variables:
      AUTH_BASE_URL:
        default: http://localhost:8080

security:
  - bearerAuth: []

tags:
  - name: profiles
    description: Profile records.
  - name: addresses
    description: Addresses, a subresource of a profile.
  - name: icons
    description: The profile icon, a single optional PNG per profile.

x-authority-freshness:
  classification: security
  change: |
    Role grants are read from the token, not from the database, on every
    authorization decision.
  today: |
    `SecurityUser.getAuthorities()` re-reads `auth.users_roles` and `auth.roles`
    on every request, because the whole principal is rehydrated per request. So
    revoking ADMIN from a user takes effect on that user's very next request,
    even though their token still carries `roles: ["ADMIN"]`.
  afterTheSplit: |
    `profile-service` owns none of those tables and authorizes from the `roles`
    claim. A revoked ADMIN therefore keeps ADMIN access to this service until the
    token expires — up to the full two-hour TTL. `identity-service` still holds
    the tables and can keep re-reading them, so the two services would diverge on
    the same revocation unless this is decided deliberately.
  decision: |
    Recorded, not resolved here. Revocation latency is a property of any
    claim-based scheme and the ticket freezes the existing HS256 claim set, so
    fixing it means either short-lived tokens with refresh, or a revocation
    check `profile-service` can make without calling `identity-service` — both
    are scheme changes, explicitly out of scope for this freeze. What is in scope
    is that it is written down: a reviewer comparing the Go service against this
    contract must not read "authorizes from the token" as equivalent to today's
    behaviour, because for revocation it is not.
  boundOnStaleness: 7200000

x-profile-id-fallback:
  problem: |
    Ten of these fifteen operations authorize with
    `#profileId == authentication.principal.getProfileId()`. Today that value is
    not a claim at all: `SecurityUser.getProfileId()` walks the `User` aggregate
    the filter loaded from the database this request, so a profile created
    mid-session is visible on the very next request and there is no lockout.

    Moving to claim-based authorization introduces one. The `profile_id` claim is
    stamped once, at login, and never refreshed, so a user who logs in without a
    profile and then creates one would carry a null claim for the rest of the
    token's life — up to the full two-hour TTL — and be locked out of the profile
    they just created. The fallback exists to keep the split from creating that
    regression, not to fix something broken today.
  decision: |
    `profile-service` falls back to a `user_id`-keyed profile lookup whenever the
    `profile_id` claim is absent or null, and authorizes against the profile id
    that lookup returns. `identity-service` does not re-mint tokens on profile
    creation.
  reasoning: |
    The fallback is one indexed read on `auth.profiles.user_id`, and only on the
    path where the claim is missing — a present claim short-circuits it, so the
    common request pays nothing. Re-minting instead would need
    `profile-service` to reach back into `identity-service` at write time, which
    is the synchronous coupling the whole split exists to avoid, and it would
    still leave every already-issued token stale. The `user_id` claim is always
    present and always correct, so the fallback has something sound to key on.
  implementationNote: |
    Falling back is not the same as trusting the request. The lookup is keyed on
    the `user_id` claim, never on a path variable, so a caller cannot widen their
    own authorization by asking for someone else's profile id.
  requiredIndex: auth.profiles.user_id

x-icon-identifier:
  decision: "`profileId` is the icon's only identifier."
  problem: |
    `ProfileIconDaoPostgres` changes its mind about what "the id" means between
    methods, four times over:

    - `findById` filters on `profile_id` while being named as if it took an icon
      id — byte for byte the same statement as `findByProfileId`.
    - `update` and `deleteById` filter on `icon_id`.
    - `create` returns `profile_id`, a value `deleteById` would misread as an
      icon id.
    - `update` filters correctly on `icon_id` and then returns
      `findByProfileId(profileIcon.id())` — feeding an icon id to a `profile_id`
      filter, so the row it hands back is the wrong one whenever the two
      sequences have diverged.

    The last of these is live code, not a latent trap: `ProfileRepositoryImpl`
    does call `create` and `update`, through `saveIcon`. It is invisible today
    only because `saveIcon` discards what the DAO returns and re-reads the
    profile, and because the two identity columns still happen to agree in the
    deployed data.
  frozenAs: |
    Every route already addresses the icon as `/api/profiles/{profileId}/icon`;
    no route accepts an icon id. The contract makes that the whole story: read,
    create, replace and delete are all keyed on `profile_id`, which is also the
    natural key, since a profile has at most one icon.
  invariantIsApplicationEnforced: |
    "At most one icon per profile" is not a database constraint today.
    `auth.profile_icons` has `icon_id` as its primary key and a **plain**
    `profile_icons_profile_id_idx` on `profile_id` — an index, not a unique
    index. The only thing stopping a second icon row is `ProfileService.addIcon`,
    which reads the profile first and answers 409 when it already carries one.
    So the invariant holds by application check, and a concurrent pair of
    uploads can still write two rows.

    Making the index unique would move the invariant into the schema and is the
    right end state, but it is a migration and belongs to its own change rather
    than to this freeze. The Go service must keep the application-level check
    until then, not assume the database is enforcing it.
  payload: |
    `ProfileIcon.id` stays in the response, frozen, because a client type
    declares it. It is documented as an opaque surrogate: no route accepts it,
    no lookup uses it, and the Go data access must not key on it.
  reasoning: |
    Choosing `icon_id` instead would mean inventing routes that do not exist and
    changing every client. Choosing `profile_id` costs nothing, matches the
    routes, matches the two methods actually in the call graph, and makes the
    the natural key for the unique index that should eventually enforce
    "at most one icon per profile".

x-path-precedence:
  constraint: |
    `{profileId}` captures the literal `user`, so two four-segment pairs overlap:
    `/api/profiles/user/{userId}` against `/api/profiles/{profileId}/address`,
    and against `/api/profiles/{profileId}/icon`.
    `/api/profiles/{profileId}` overlaps neither — it is three segments where the
    others are four, so no URI reaches both.
  howSpringResolvesIt: |
    Pattern specificity is the last step, not the first. `RequestMappingInfo`
    narrows the candidates by HTTP method, then by `produces`, and only compares
    patterns among whatever survives. So an overlap is invisible wherever the
    two mappings differ in method or in the media type they produce, and the
    comparator's verdict never gets a chance to apply.

    When it does apply, `PathPattern.SPECIFICITY_COMPARATOR` compares catch-all,
    then capture count, then normalized length — the pattern length with each
    `{capture}` counted as one character, longer being more specific. Segment
    position is not a factor, and a literal segment carries no weight over a
    template one. Measured: `user/{userId}` is 20, `{profileId}/address` is 23,
    `{profileId}/icon` is 20, so the address pattern outranks `user/{userId}` and
    the icon pattern ties it exactly.
  measuredRouting: |
    Resolved against the running `RequestMappingHandlerMapping`, not reasoned
    from the comparator:

    - `/api/profiles/user/address` — GET, PUT and DELETE reach
      `getProfileByUserId`, `updateProfileByUserId` and `deleteProfileByUserId`.
      The address pattern maps POST only, so the method condition drops it before
      any pattern comparison; its higher specificity never comes into it. POST
      reaches `addAddress` because it is then the only candidate.
    - `/api/profiles/user/icon` — GET reaches `getProfileByUserId` with the
      `Accept` header unset, `*/*`, or `application/json`, and reaches
      `getProfileIcon` only for `Accept: image/png`. `getProfileIcon` is the one
      handler here that declares `produces`, so the produces condition breaks the
      tie that the pattern comparator cannot. POST reaches `addIcon` as the only
      candidate.
    - **PUT and DELETE on `/api/profiles/user/icon` throw
      `IllegalStateException: Ambiguous handler methods mapped` and answer 500.**
      Those two methods are mapped by both patterns, neither declares `produces`,
      and the patterns tie — so nothing is left to separate them.
  defect: |
    The two 500s are a defect to carry knowingly, not a precedence for the Go
    router to reproduce. Not fixed here: the fix is a route change, and this
    document freezes routes.

    A Go router should reject the ambiguity at startup rather than at request
    time, which turns a production 500 into a build failure. It must also not
    assume the tie is theoretical: it is reachable by any client that sends
    `PUT` or `DELETE` to that URI.
  lint: |
    `no-ambiguous-paths` is switched off for this document in `redocly.yaml`,
    covering exactly the two pairs above, with this entry as the record of why.

x-stale-profile-claim:
  classification: security
  change: |
    After a caller deletes their own profile, the ten operations that authorize
    on `profileId` answer differently than they do today.
  today: |
    The principal is rehydrated from the database each request, so once the row
    is gone `SecurityUser.getProfileId()` returns null. The predicate compares a
    non-null path variable against null, which is false, and the access-denied
    handler answers **403** for all ten.
  afterTheSplit: |
    The token still carries the old, non-null `profile_id`. The caller's own path
    variable matches it, so the predicate passes and each operation proceeds to
    whatever it does next. That splits the ten in two, by whether the handler
    looks the resource up before acting:

    - **403 becomes 404** on the eight that look up first: `GET` and `PUT`
      `/api/profiles/{profileId}`, `POST /api/profiles/{profileId}/address`,
      `PUT` and `DELETE` `/api/profiles/{profileId}/address/{addressId}`, and
      `GET`, `POST` and `PUT` `/api/profiles/{profileId}/icon`.
    - **403 becomes 204** on the two that do not: `DELETE
      /api/profiles/{profileId}` and `DELETE /api/profiles/{profileId}/icon`
      issue their deletes without reading anything first, so a caller who owns
      nothing gets a silent success.

    The `x-profile-id-fallback` above does not cover any of this: it triggers on
    an absent claim, and this claim is present and stale.
  reasoning: |
    Recorded because both halves are widenings, and the 204 half is the wider
    one — 404 at least tells the caller nothing was there, while 204 reports
    success for a delete that matched no row. Neither is exploitable while the
    profile is genuinely gone, and both stop being harmless the moment a
    `profile_id` is reused, which is why the Go schema must never recycle it.

    Restoring 403 exactly would mean checking profile existence before
    authorizing on every one of the ten, which is the per-request database read
    the split exists to remove.
  clientImpact: |
    The frontends' shared error helper maps 403 and 404 to different strings, so
    a user who deletes their profile and keeps clicking sees a different message.
    No screen breaks, and the remedy in every case is to re-authenticate.

x-multipart-limits:
  maxFileSize: 2MB
  maxRequestSize: 2MB
  source: '`spring.servlet.multipart.max-file-size` and `max-request-size`.'
  onExceeded: |
    `MultipartException`, answered 400 with the exception message as
    `text/plain`. The limit applies to the whole request as well as the file, so
    a 2 MB file plus its part headers is already over.

paths:
  /api/profiles:
    get:
      tags: [profiles]
      operationId: getProfiles
      summary: List profiles, one page at a time.
      x-authorization:
        rule: ADMIN
        preAuthorize: "hasAuthority('ADMIN')"
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: A page of profiles as a bare array. No envelope, no total count.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [profiles]
      operationId: createProfile
      summary: Create a profile for a user.
      description: |
        One profile per user. A second create for the same user id is 409.
      x-authorization:
        rule: ADMIN_OR_SELF_BY_BODY_USER_ID
        preAuthorize: "hasAuthority('ADMIN') or #profile.userId() == authentication.principal.getUserId()"
        note: |
          The only rule in either service that reads the request body rather than
          a path variable or a claim. A caller may create a profile for
          themselves, an ADMIN for anyone.
      x-cross-boundary-read:
        today: |
          `ProfileService.createProfile` calls `UserRepository.findById` to prove
          the user exists before inserting, and resolves the acting principal's
          user id by email for the audit columns.
        frozenAs: |
          Neither read survives the split. The acting user id comes from the
          `user_id` claim, and the existence check becomes a foreign key on
          `auth.profiles.user_id` — enforced by Postgres, stronger than the
          application check it replaces, and free on the request path. The 404
          below is preserved: a foreign-key violation on insert is reported as a
          missing user, not as a 500.
      parameters:
        - $ref: '#/components/parameters/AuthorizationHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileCreateRequestDTO'
      responses:
        '201':
          description: Profile created. springdoc reports 200; the handler builds `HttpStatus.CREATED`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/profiles/{profileId}:
    get:
      tags: [profiles]
      operationId: getProfileById
      summary: Read one profile.
      x-authorization:
        rule: ADMIN_OR_SELF_BY_PROFILE_ID
        preAuthorize: "hasAuthority('ADMIN') or #profileId == authentication.principal.getProfileId()"
        note: Subject to the `profile_id` claim fallback described in `x-profile-id-fallback`.
      parameters:
        - $ref: '#/components/parameters/ProfileId'
      responses:
        '200':
          description: The profile, with its addresses and icon metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [profiles]
      operationId: updateProfileById
      summary: Replace a profile's name fields and birthdate.
      description: '`userId` is not in the update body: a profile cannot be moved between users.'
      x-authorization:
        rule: ADMIN_OR_SELF_BY_PROFILE_ID
        preAuthorize: "hasAuthority('ADMIN') or #profileId == authentication.principal.getProfileId()"
        note: Subject to the `profile_id` claim fallback described in `x-profile-id-fallback`.
      parameters:
        - $ref: '#/components/parameters/ProfileId'
        - $ref: '#/components/parameters/AuthorizationHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequestDTO'
      responses:
        '200':
          description: The updated profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [profiles]
      operationId: deleteProfileById
      summary: Delete a profile with its addresses and icon.
      description: |
        A no-op for an id that does not exist, and still 204.

        Deleting your own profile changes what your existing token can do, and
        the split changes it differently — see `x-behaviour-change`.
      x-authorization:
        rule: ADMIN_OR_SELF_BY_PROFILE_ID
        preAuthorize: "hasAuthority('ADMIN') or #profileId == authentication.principal.getProfileId()"
      x-behaviour-change:
        change: |
          After deleting their own profile, a non-admin caller reusing the same
          token gets **204** here where today they get 403.
        classification: security
        today: |
          The principal is rehydrated per request, so once the row is gone
          `getProfileId()` returns null, the predicate is false, and this
          operation answers 403.
        frozenAs: |
          Under claim-based authorization the stale non-null claim matches the
          path variable, the predicate passes, and the handler deletes without
          reading anything first — `ProfileRepositoryImpl.deleteById` has no
          existence check, which is also why this operation has no 404 in its
          response set at all. So the caller gets a silent success for a delete
          that matched no row.
        reasoning: |
          This is the wider half of the widening described in
          `x-stale-profile-claim`: the eight operations that look up first
          degrade to 404, which at least says nothing was there, while this one
          and `DELETE /api/profiles/{profileId}/icon` report success. Recorded
          rather than corrected, because correcting it means an existence check
          before authorizing — the per-request read the split removes.
        seeAlso: x-stale-profile-claim
      parameters:
        - $ref: '#/components/parameters/ProfileId'
        - $ref: '#/components/parameters/AuthorizationHeader'
      responses:
        '204':
          description: |
            Deleted, no body. springdoc reports `200` with a `Profile` body
            because the handler's declared return type is
            `ResponseEntity<Profile>`; the body it builds is `noContent()`.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/profiles/user/{userId}:
    get:
      tags: [profiles]
      operationId: getProfileByUserId
      summary: Read a user's profile.
      description: |
        The operation `identity-service` clients use once the `User` payload no
        longer embeds the profile aggregate.
      x-authorization:
        rule: ADMIN_OR_SELF_BY_USER_ID
        preAuthorize: "hasAuthority('ADMIN') or #userId == authentication.principal.getUserId()"
        note: |
          Keyed on `user_id`, which is always present in the token, so this
          operation is unaffected by the `profile_id` staleness.
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: The profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [profiles]
      operationId: updateProfileByUserId
      summary: Replace a user's profile.
      x-authorization:
        rule: ADMIN_OR_SELF_BY_USER_ID
        preAuthorize: "hasAuthority('ADMIN') or #userId == authentication.principal.getUserId()"
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/AuthorizationHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequestDTO'
      responses:
        '200':
          description: The updated profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [profiles]
      operationId: deleteProfileByUserId
      summary: Delete a user's profile with its addresses and icon.
      description: A no-op for a user id with no profile, and still 204.
      x-authorization:
        rule: ADMIN_OR_SELF_BY_USER_ID
        preAuthorize: "hasAuthority('ADMIN') or #userId == authentication.principal.getUserId()"
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/AuthorizationHeader'
      responses:
        '204':
          description: Deleted, no body. springdoc reports 200 with a `Profile` body; the handler builds `noContent()`.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/profiles/{profileId}/address:
    post:
      tags: [addresses]
      operationId: addAddress
      summary: Add an address to a profile.
      description: |
        Returns 200, not 201, unlike every other create in either service. The
        handler builds `ResponseEntity.ok`. Frozen as-is: the asymmetry is
        harmless and changing it would be a client-visible change for nothing.

        The response is the whole profile, not the created address, so a client
        that needs the new address id reads it from `addresses`.
      x-authorization:
        rule: ADMIN_OR_SELF_BY_PROFILE_ID
        preAuthorize: "hasAuthority('ADMIN') or #profileId == authentication.principal.getProfileId()"
      parameters:
        - $ref: '#/components/parameters/ProfileId'
        - $ref: '#/components/parameters/AuthorizationHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressRequestDTO'
      responses:
        '200':
          description: The profile with the new address in `addresses`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/profiles/{profileId}/address/{addressId}:
    put:
      tags: [addresses]
      operationId: updateAddress
      summary: Replace one of a profile's addresses.
      description: |
        Scoped to the profile: the handler resolves the address inside that
        profile's own address set, so an `addressId` belonging to another profile
        is 404 rather than an edit.
      x-authorization:
        rule: ADMIN_OR_SELF_BY_PROFILE_ID
        preAuthorize: "hasAuthority('ADMIN') or #profileId == authentication.principal.getProfileId()"
      parameters:
        - $ref: '#/components/parameters/ProfileId'
        - $ref: '#/components/parameters/AddressId'
        - $ref: '#/components/parameters/AuthorizationHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressRequestDTO'
      responses:
        '200':
          description: The profile with the updated address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [addresses]
      operationId: deleteAddress
      summary: Delete one of a profile's addresses.
      x-authorization:
        rule: ADMIN_OR_SELF_BY_PROFILE_ID
        preAuthorize: "hasAuthority('ADMIN') or #profileId == authentication.principal.getProfileId()"
      description: |
        Scoped to the profile in the path, and 404 when the address does not
        belong to it. This is a transcription, not a deviation: the scoping is in
        `AddressDaoPostgres.deleteByProfileIdAndAddressId`, whose statement is
        `DELETE FROM auth.addresses WHERE address_id = :addressId AND profile_id
        = :profileId`, and `ProfileService.deleteAddress` raises
        `ResourceNotFoundException` when it deletes no row.

        It was not always so, and the history is worth keeping: until recently
        the handler took `profileId`, used it for the authorization check, and
        then deleted by `addressId` alone, so any authenticated principal with a
        profile could delete any address in the table by guessing a sequential id
        and get 204 for it. This contract specified the scoped behaviour while
        that was still true, because writing an insecure direct object reference
        into the document the Go services are built and parity-tested against
        would have had the generated suite certify it. The application has since
        been fixed independently, so contract and code now agree.
      parameters:
        - $ref: '#/components/parameters/ProfileId'
        - $ref: '#/components/parameters/AddressId'
        - $ref: '#/components/parameters/AuthorizationHeader'
      responses:
        '204':
          description: Deleted, no body. springdoc reports 200 with a `Profile` body; the handler builds `noContent()`.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: |
            The address does not belong to the profile in the path, so the
            scoped delete matched no row. `Address not found with id {addressId}
            for profile with id {profileId}` as `text/plain`. Unreachable for any
            caller acting on their own data.
          content:
            text/plain:
              schema:
                type: string

  /api/profiles/{profileId}/icon:
    get:
      tags: [icons]
      operationId: getProfileIcon
      summary: Download a profile's icon.
      description: |
        The only non-JSON response in either service: the raw bytes of the stored
        icon, declared `image/png` by the handler's `produces`. The bytes are
        whatever was uploaded — nothing validates that they are a PNG, so the
        declared type is a promise the service does not check. Frozen; a Go
        implementation that starts sniffing content types would change behaviour
        for existing rows.
      x-authorization:
        rule: ADMIN_OR_SELF_BY_PROFILE_ID
        preAuthorize: "hasAuthority('ADMIN') or #profileId == authentication.principal.getProfileId()"
      parameters:
        - $ref: '#/components/parameters/ProfileId'
      responses:
        '200':
          description: The icon bytes.
          content:
            image/png:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The profile has no icon. `Profile icon not found with id {profileId}` as `text/plain`.
          content:
            text/plain:
              schema:
                type: string
    post:
      tags: [icons]
      operationId: addIcon
      summary: Upload a profile's first icon.
      description: |
        `multipart/form-data` with one part named `icon`, capped by
        `x-multipart-limits`. springdoc declares the body `application/json`
        because it renders the `MultipartFile` parameter as a JSON object with a
        binary property; the handler consumes multipart and nothing else.
      x-authorization:
        rule: ADMIN_OR_SELF_BY_PROFILE_ID
        preAuthorize: "hasAuthority('ADMIN') or #profileId == authentication.principal.getProfileId()"
      parameters:
        - $ref: '#/components/parameters/ProfileId'
        - $ref: '#/components/parameters/AuthorizationHeader'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/IconUpload'
      responses:
        '200':
          description: The profile with its new icon.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          description: |
            The `icon` part is missing
            (`MissingServletRequestPartException`), or the upload is over the 2 MB
            cap (`MultipartException`). Both answer `text/plain` with the
            exception's own message.
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The profile already has an icon. Replace it with `PUT` instead.
          content:
            text/plain:
              schema:
                type: string
        '500':
          $ref: '#/components/responses/IconUploadFailed'
    put:
      tags: [icons]
      operationId: updateIcon
      summary: Replace a profile's icon.
      description: |
        `multipart/form-data` with one part named `icon`, as for the upload.

        Replacing an icon on a profile that has none is 500, not 404: the handler
        reads the current icon's id to carry it onto the replacement and
        dereferences null when there is no current icon. Frozen as a documented
        status rather than silently corrected, because a client that gets 500
        today would get 404 tomorrow, and the frontends' error text is keyed on
        the status. Correcting it is a behaviour change and belongs with the
        service rewrite, not with the freeze.
      x-authorization:
        rule: ADMIN_OR_SELF_BY_PROFILE_ID
        preAuthorize: "hasAuthority('ADMIN') or #profileId == authentication.principal.getProfileId()"
      parameters:
        - $ref: '#/components/parameters/ProfileId'
        - $ref: '#/components/parameters/AuthorizationHeader'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/IconUpload'
      responses:
        '200':
          description: The profile with its replaced icon.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          description: The `icon` part is missing, or the upload is over the 2 MB cap.
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          description: |
            The upload could not be read (`IconUploadException`), or the profile
            had no icon to replace — see the description above. `text/plain` for
            the first, the container error body for the second.
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                $ref: '#/components/schemas/ContainerError'
    delete:
      tags: [icons]
      operationId: deleteIcon
      summary: Delete a profile's icon.
      description: |
        Keyed on `profile_id` — see `x-icon-identifier`. A no-op for a profile
        with no icon, and still 204.
      x-authorization:
        rule: ADMIN_OR_SELF_BY_PROFILE_ID
        preAuthorize: "hasAuthority('ADMIN') or #profileId == authentication.principal.getProfileId()"
      parameters:
        - $ref: '#/components/parameters/ProfileId'
        - $ref: '#/components/parameters/AuthorizationHeader'
      responses:
        '204':
          description: Deleted, no body. springdoc reports 200 with a `Profile` body; the handler builds `noContent()`.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        `Authorization: Bearer <jwt>`, minted by `identity-service` and verified
        here against the shared HS256 secret. The claim set is documented as
        `x-jwt-claims` in the identity contract; this service reads `roles`,
        `user_id` and `profile_id` from it and calls nothing.

  parameters:
    Page:
      name: page
      in: query
      required: false
      description: |
        Zero-based page index. Out-of-range input is clamped, not rejected: a
        negative page is served as page 0 with a 200, never a 400.
      schema:
        type: integer
        format: int32
        default: 0
        minimum: 0
    Size:
      name: size
      in: query
      required: false
      description: |
        Page size, bounded server-side to at most 500 rows so the listing always
        issues a bounded query whatever the caller asks for. Like `page`, out-of
        -range input is clamped rather than rejected: `size=0` is served as 1 and
        `size=100000` as 500, both with a 200. `minimum` and `maximum` here
        describe the range the service will actually serve, not a range it
        validates — a request outside it succeeds.
      schema:
        type: integer
        format: int32
        default: 100
        minimum: 1
        maximum: 500
    ProfileId:
      name: profileId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    AddressId:
      name: addressId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    AuthorizationHeader:
      name: Authorization
      in: header
      required: true
      description: |
        Declared explicitly because the handler reads the raw header to resolve
        the acting user for the audit columns. Redundant with the `bearerAuth`
        security scheme and kept only because removing it would change the served
        document. In the Go service the acting user comes from the verified
        `user_id` claim and this parameter disappears.
      schema:
        type: string

  responses:
    BadRequest:
      description: |
        Bean-validation failures produce a JSON object of field name to message;
        an unparseable body produces the fixed `text/plain` string
        `Request body is invalid. Please check the format and try again.`
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrors'
        text/plain:
          schema:
            type: string
    Unauthorized:
      description: |
        No token, an expired token, or a token that fails verification. Written
        through `HttpServletResponse.sendError`, so the body is the servlet
        container's error representation. Clients key off the status and the
        header, never the body.
      headers:
        Access-Denied-Reason:
          description: '`Authentication Required`'
          required: true
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ContainerError'
    Forbidden:
      description: |
        Authenticated but not permitted by the operation's `x-authorization`
        rule. Written through `sendError`, so the body is the container's error
        representation.
      headers:
        Access-Denied-Reason:
          description: '`Not Authorized`'
          required: true
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ContainerError'
    NotFound:
      description: |
        `ResourceNotFoundException`. The body is the exception message as
        `text/plain`, e.g. `Profile not found with id 42`.
      content:
        text/plain:
          schema:
            type: string
    Conflict:
      description: |
        `ResourceExistsException`. The body is the exception message as
        `text/plain`, e.g. `Profile already exists for user with id 7`.
      content:
        text/plain:
          schema:
            type: string
    IconUploadFailed:
      description: |
        `IconUploadException` — the uploaded part could not be read. The body is
        the exception message as `text/plain`.
      content:
        text/plain:
          schema:
            type: string

  schemas:
    ProfileCreateRequestDTO:
      type: object
      properties:
        firstName:
          type: string
          minLength: 1
        middleName:
          type: string
        lastName:
          type: string
          minLength: 1
        birthdate:
          type: string
          format: date-time
        userId:
          type: integer
          format: int64
          description: The user this profile belongs to. Immutable once created.
      required: [firstName, lastName, birthdate, userId]

    ProfileUpdateRequestDTO:
      type: object
      description: The create body without `userId`, which cannot be changed.
      properties:
        firstName:
          type: string
          minLength: 1
        middleName:
          type: string
        lastName:
          type: string
          minLength: 1
        birthdate:
          type: string
          format: date-time
      required: [firstName, lastName, birthdate]

    AddressRequestDTO:
      type: object
      properties:
        addressLine1:
          type: string
          minLength: 1
        addressLine2:
          type: string
        city:
          type: string
          minLength: 1
        stateProvince:
          type: string
          minLength: 1
        postalCode:
          type: string
          minLength: 1
        country:
          type: string
          minLength: 1
      required: [addressLine1, city, stateProvince, postalCode, country]

    IconUpload:
      type: object
      description: |
        One multipart part named `icon`. The part name is fixed by the handler's
        `@RequestParam("icon")`; a different name is 400.
      properties:
        icon:
          type: string
          format: binary
          description: The icon bytes, at most 2 MB.
      required: [icon]

    Profile:
      type: object
      description: |
        The profile aggregate. Returned whole by every operation on this service
        except the icon download and the deletes, including the address and icon
        writes, which answer with the parent profile rather than the subresource.
      properties:
        id:
          type: integer
          format: int64
        firstName:
          type: string
        middleName:
          type: [string, 'null']
        lastName:
          type: string
        birthdate:
          type: string
          format: date-time
        userId:
          type: integer
          format: int64
        addresses:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Address'
        icon:
          description: |
            The icon's metadata and bytes, or null when the profile has none.
            Base64 in JSON, so a profile read carries the whole image; the
            dedicated `image/png` download exists for clients that want the bytes
            without the envelope.
          oneOf:
            - $ref: '#/components/schemas/ProfileIcon'
            - type: 'null'
        createdByUserId:
          type: integer
          format: int64
        createdTime:
          type: string
          format: date-time
        modifiedByUserId:
          type: integer
          format: int64
        modifiedTime:
          type: string
          format: date-time

    Address:
      type: object
      properties:
        id:
          type: integer
          format: int64
        addressLine1:
          type: string
        addressLine2:
          type: [string, 'null']
        city:
          type: string
        stateProvince:
          type: string
        postalCode:
          type: string
        country:
          type: string
        profileId:
          type: integer
          format: int64
        createdByUserId:
          type: integer
          format: int64
        createdTime:
          type: string
          format: date-time
        modifiedByUserId:
          type: integer
          format: int64
        modifiedTime:
          type: string
          format: date-time

    ProfileIcon:
      type: object
      description: |
        Icon metadata plus the bytes. Identified by `profileId` — see
        `x-icon-identifier`.
      properties:
        id:
          type: integer
          format: int64
          description: |
            Opaque surrogate key. No route accepts it and no lookup uses it;
            `profileId` is the icon's identifier. Present because a client type
            declares it.
        profileId:
          type: integer
          format: int64
          description: The icon's identifier. At most one icon per profile.
        icon:
          type: string
          contentEncoding: base64
          description: The stored bytes, base64-encoded in JSON.
        createdByUserId:
          type: integer
          format: int64
        createdTime:
          type: string
          format: date-time
        modifiedByUserId:
          type: integer
          format: int64
        modifiedTime:
          type: string
          format: date-time

    ValidationErrors:
      type: object
      description: Field name to validation message, one entry per rejected field.
      additionalProperties:
        type: string

    ContainerError:
      type: object
      description: |
        The servlet container's error body, produced whenever a status is set
        through `sendError` rather than composed by a handler. Its exact keys are
        a framework detail; the frontends' shared error helper switches on the
        status code alone.
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          format: int32
        error:
          type: string
        message:
          type: string
        path:
          type: string
