# Lint configuration for the two frozen service contracts.
#
# The ruleset is named rather than left to the CLI default so that a Redocly
# upgrade cannot quietly change what CI enforces on a frozen document.
extends:
  - recommended

apis:
  identity-service:
    root: ./identity-service.openapi.yaml
  profile-service:
    root: ./profile-service.openapi.yaml
    rules:
      # Scoped to this document, because only this one has ambiguous paths.
      # `{profileId}` captures any literal, so `by-user/{userId}` overlaps
      # `{profileId}/address` and `{profileId}/icon` — two pairs, two warnings.
      # Both are real: OpenAPI cannot express which template wins, and the
      # overlap survives the move that removed the ambiguity Spring could not
      # resolve. `x-path-precedence` in this document records the measured
      # routing for both pairs. Leaving the rule on would emit the same two
      # warnings on every run forever, which is how real findings get scrolled
      # past.
      no-ambiguous-paths: off
