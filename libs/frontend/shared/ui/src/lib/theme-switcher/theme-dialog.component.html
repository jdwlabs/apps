<h2 mat-dialog-title id="theme-dialog-title">Change theme</h2>
<mat-dialog-content>
  <mat-radio-group
    aria-labelledby="theme-dialog-title"
    [value]="current()"
    (change)="choose($event.value)"
  >
    @for (theme of options; track theme.id) {
      <mat-radio-button [value]="theme.id" data-cy="theme-option">
        {{ theme.label }}
      </mat-radio-button>
    }
  </mat-radio-group>

  @if (customisable()) {
    <label for="theme-colour">Brand colour</label>
    <input
      id="theme-colour"
      type="color"
      data-cy="theme-colour"
      [value]="colour()"
      (change)="recolour($any($event.target).value)"
    />
  }
</mat-dialog-content>
