<jdw-header
  (toggleSideNav)="handleToggle()"
  [appRouterLink]="appRouterLink"
  [appTitle]="appTitle"
  [appTooltip]="appTooltip"
  [color]="headerColor"
  [isXSmallScreen]="isXSmallScreen"
>
  <div class="header-row">
    <jdw-env-badge [environment]="currentEnv" [version]="currentVersion" />
    <jdw-theme-switcher />
    @let accountView = accountView$ | async;
    <jdw-account-menu
      (account)="goToAccount(accountView)"
      (profile)="goToProfile(accountView)"
      (signIn)="signIn()"
      (signOut)="signOut()"
      (signUp)="signUp()"
      [view]="accountView"
    />
  </div>
</jdw-header>
<jdw-navigation-layout
  (sideNavChange)="sideNavChange($event)"
  [isSideNavEnabled]="isSideNavEnabled"
  [isSideNavOpened]="isSideNavOpened"
  [navigationItems]="navigationItems"
  [sideNavMode]="sideNavMode"
>
  <router-outlet></router-outlet>
</jdw-navigation-layout>
