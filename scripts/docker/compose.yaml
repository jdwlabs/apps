name: jdw
services:
  jdw-container:
    image: jdwlabs/container:latest
    ports:
      - '4200:80'
    restart: unless-stopped
    environment:
      - ENVIRONMENT=LOCAL
      - SERVICE_DISCOVERY_BASE_URL=http://localhost:9000
      - AUTH_BASE_URL=http://localhost:8080

  jdw-authui:
    image: jdwlabs/authui:latest
    ports:
      - '4201:80'
    restart: unless-stopped
    environment:
      - ENVIRONMENT=LOCAL
      - AUTH_BASE_URL=http://localhost:8080

  jdw-authdb:
    image: jdwlabs/authdb:latest
    ports:
      - '5432:5432'
    volumes:
      # Postgres 18+ images store data in a per-major-version subdirectory and
      # refuse to start if anything is mounted at the old /var/lib/postgresql/data
      # path, so the persistent volume must mount at /var/lib/postgresql.
      - authdb-data:/var/lib/postgresql
    restart: unless-stopped

  jdw-usersrole:
    image: jdwlabs/usersrole:latest
    ports:
      - '8080:8080'
    restart: unless-stopped
    environment:
      - UR_JWT_SECRET_KEY=${UR_JWT_SECRET_KEY}
      - UR_PG_DATASOURCE_URL=jdbc:postgresql://jdw-authdb:5432/jdw
      - UR_PG_USERNAME=default_user
      - UR_PG_PASSWORD=default_password

  jdw-servicediscovery:
    image: jdwlabs/servicediscovery:latest
    ports:
      - '9000:9000'
    restart: unless-stopped
    environment:
      - SD_PORT=9000
    configs:
      - source: service-discovery-config
        target: /app/config.json

  jdw-usersui:
    image: jdwlabs/usersui:latest
    ports:
      - '4202:80'
    restart: unless-stopped
    environment:
      - ENVIRONMENT=LOCAL
      - AUTH_BASE_URL=http://localhost:8080

  jdw-rolesui:
    image: jdwlabs/rolesui:latest
    ports:
      - '4203:80'
    restart: unless-stopped
    environment:
      - ENVIRONMENT=LOCAL
      - AUTH_BASE_URL=http://localhost:8080

configs:
  service-discovery-config:
    external: false
    file: ./config.json

volumes:
  authdb-data:
