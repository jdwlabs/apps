name: Security Scan

on:
  pull_request:
  push:
    branches: [main]
    # Code-scanning alerts track the default branch, so the main-branch run has
    # to stay; docs-only pushes cannot change what the scanners find.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

# Superseded PR pushes are cancelled; main runs queue so every default-branch
# commit still uploads its SARIF.
concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    uses: jdwlabs/.github/.github/workflows/security-scan.yml@main
    # Trivy findings are non-blocking: they surface in the Security tab
    # without gating merges. Flip fail-on-findings to true once the finding
    # volume across all repos has been triaged as real signal, not noise.
    # The gitleaks secrets gate inside the reusable workflow always blocks.
