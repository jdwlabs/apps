name: Release Component

on:
  push:
    tags:
      - '*-v[0-9]*'    # new format: usersui-v1.3.6 (Nx release, going forward)
      - '*-[0-9]*'     # old format: usersui-1.3.5 (@jscutlery/semver, transition period)

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0

      - name: Parse tag
        id: tag
        run: |
          TAG="${{ github.ref_name }}"
          # Handle both formats: component-v1.2.3 and component-1.2.3
          if echo "$TAG" | grep -qP '^[a-z0-9-]+-v[0-9]'; then
            # New format: component-vMAJOR.MINOR.PATCH
            COMPONENT=$(echo "$TAG" | sed 's/-v[0-9].*//')
            VERSION=$(echo "$TAG" | sed "s/${COMPONENT}-v//")
          else
            # Old format: component-MAJOR.MINOR.PATCH
            COMPONENT=$(echo "$TAG" | sed 's/-[0-9].*//')
            VERSION=$(echo "$TAG" | sed "s/${COMPONENT}-//")
          fi
          echo "component=$COMPONENT" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Find previous tag for this component
        id: prev_tag
        run: |
          COMPONENT="${{ steps.tag.outputs.component }}"
          CURRENT="${{ github.ref_name }}"
          # Search both old and new format tags for this component
          PREV=$(git tag --list "${COMPONENT}-v*" "${COMPONENT}-[0-9]*" \
            --sort=-version:refname \
            | grep -v "^${CURRENT}$" \
            | head -1 || true)
          echo "tag=${PREV}" >> $GITHUB_OUTPUT

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMPONENT="${{ steps.tag.outputs.component }}"
          VERSION="${{ steps.tag.outputs.version }}"
          TAG="${{ github.ref_name }}"
          PREV="${{ steps.prev_tag.outputs.tag }}"
          TITLE="${COMPONENT} v${VERSION}"

          if [ -n "$PREV" ]; then
            gh release create "$TAG" \
              --title "$TITLE" \
              --generate-notes \
              --notes-start-tag "$PREV"
          else
            gh release create "$TAG" \
              --title "$TITLE" \
              --generate-notes
          fi
