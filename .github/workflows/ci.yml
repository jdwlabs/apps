name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  actions: write
  contents: write

# Cancel superseded PR runs; never cancel a main-push (it may be mid-release).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Ephemeral ARC pods: no daemon to reuse, and a lingering daemon is what hangs
  # @nx/gradle graph creation. Run gradle one-shot.
  NX_DAEMON: 'false'
  GRADLE_OPTS: '-Dorg.gradle.daemon=false'
  # @nx/gradle generates the project graph by invoking gradle with a 120s default
  # timeout. A cold gradle (dist download + full Spring Boot dep resolution) can
  # exceed it, failing the whole graph. Raise it so a cold run can complete and
  # seed the gradle cache. The Warm Gradle step below makes the steady state fast.
  NX_GRADLE_PROJECT_GRAPH_TIMEOUT: '600'

jobs:
  main:
    runs-on: ubuntu-jdwlabs
    # Fail fast: a stuck/looping job otherwise runs to the 6h platform cap,
    # starving the self-hosted runner queue for other PRs.
    timeout-minutes: 30
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
    steps:
      - if: ${{ github.event_name != 'pull_request' }}
        name: Generate release app token
        id: release-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - name: Checkout Codebase
        uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0
          # On main-push, check out with the release App token so the persisted
          # git credential IS the App's — every later push (semver/postTargets)
          # authenticates as the App, a ruleset bypass actor, and isn't declined.
          # Falls back to the default token on PRs (token step is skipped there).
          token: ${{ steps.release-token.outputs.token || github.token }}
      # JDK must exist before the first nx command: @nx/gradle (apps/backend/**)
      # shells out to gradle 8.7 to build the project graph, and usersrole targets
      # Java 21. Without this, gradle stalls provisioning a toolchain — the cause
      # of the ~11-min "Failed to process project graph" hang.
      - name: Setup Java
        uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.2.0
      # Pre-warm gradle (download dist + resolve deps) so the later @nx/gradle
      # graph generation is ~1s instead of timing out cold. Seeds the gradle
      # cache; near-instant once the cache is warm.
      - name: Warm Gradle
        working-directory: apps/backend/usersrole
        run: ./gradlew help -q
      # This line enables distribution
      # The "--stop-agents-after" is optional, but allows idle agents to shut down once the "e2e-ci" targets have been requested
      # - name: Enable NX Cloud Distribution
      #   run: pnpm exec nx-cloud start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="build"
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '22'
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Setup Base and SHAs for 'nx affected'
        uses: nrwl/nx-set-shas@v4
      - if: ${{ github.event_name == 'pull_request' }}
        name: Setup Main Branch Tracking
        run: git branch --track main origin/main
      - if: ${{ github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' }}
        name: Validate Commit Messages
        run: pnpm exec commitlint --from=${{ github.event.pull_request.base.sha }} --to=${{ github.event.pull_request.head.sha }}
      - name: Run Format Check
        run: pnpm exec nx-cloud record -- nx format:check
      - name: Reset NX
        run: pnpm exec nx reset
      - name: Run Linting & Unit Tests
        run: pnpm exec nx affected -t lint test
      - name: Run Build
        run: pnpm exec nx affected -t build
      - if: ${{ github.event_name != 'pull_request' }}
        name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - if: ${{ github.event_name != 'pull_request' }}
        name: Setup SSH
        uses: MrSquaare/ssh-setup-action@v3
        with:
          host: github.com
          private-key: ${{ secrets.ACTIONS_PRIVATE_KEY }}
      - if: ${{ github.event_name != 'pull_request' }}
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: 'kubernetes'
          driver-opts: |
            qemu.install=true
          platforms: 'linux/amd64,linux/arm64'
      - if: ${{ github.event_name != 'pull_request' }}
        name: Run Version Upgrades
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "github-actions[bot]"
          # main-push is a detached HEAD; put HEAD on a real `main` so the version
          # commit + push resolve. The push authenticates as the release App
          # (token persisted by checkout above), which bypasses the require-PR rule.
          git checkout -B main
          pnpm exec nx affected -t version --parallel=1

      # Self-heal can loop indefinitely on a hard failure; cap it so it can't
      # consume the whole job budget.
      - run: npx nx fix-ci
        if: always()
        timeout-minutes: 10
