name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  actions: write
  contents: write

# Cancel superseded PR runs; a main-push always runs quality gates to completion.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Ephemeral CI runners: no daemon to reuse, and a lingering daemon is what hangs
  # @nx/gradle graph creation. Run gradle one-shot.
  NX_DAEMON: 'false'
  GRADLE_OPTS: '-Dorg.gradle.daemon=false'
  # @nx/gradle generates the project graph by invoking gradle with a 120s default
  # timeout. A cold gradle (dist download + full Spring Boot dep resolution) can
  # exceed it, failing the whole graph. Raise it so a cold run can complete and
  # seed the gradle cache. The Warm Gradle step below makes the steady state fast.
  NX_GRADLE_PROJECT_GRAPH_TIMEOUT: '600'

jobs:
  main:
    # Release postTargets push chore commits back to main authenticated as the
    # release App — those pushes DO trigger workflows (App tokens bypass the
    # GITHUB_TOKEN recursion suppression). Without this guard the pipeline
    # re-versions the just-released projects forever: the conventionalcommits
    # preset patch-bumps on any commit, including the release's own chore
    # commits — producing an endless ~5-minute release loop.
    if: ${{ github.event_name != 'push' || github.triggering_actor != 'jdwlabs-release-bot[bot]' }}
    runs-on: ubuntu-latest
    # Fail fast: cap runtime so a stuck/looping job can't burn the Actions budget.
    timeout-minutes: 30
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0
          token: ${{ github.token }}
      # JDK must exist before the first nx command: @nx/gradle (apps/backend/**)
      # shells out to gradle 8.7 to build the project graph, and usersrole targets
      # Java 21. Without this, gradle stalls provisioning a toolchain — the cause
      # of the ~11-min "Failed to process project graph" hang.
      - name: Setup Java
        uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.2.0
      # Pre-warm gradle (download dist + resolve deps) so the later @nx/gradle
      # graph generation is ~1s instead of timing out cold. Seeds the gradle
      # cache; near-instant once the cache is warm.
      - name: Warm Gradle
        working-directory: apps/backend/usersrole
        run: ./gradlew help -q
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9
      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '22'
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      # Persist Nx's task cache across runs via the GitHub Actions cache. The
      # run_id suffix always writes a fresh entry; restore-keys pull the most
      # recent prior cache. GitHub scopes caches per branch, so a PR can't poison
      # main's cache (the CREEP class of issue with shared remote caches).
      - name: Restore Nx cache
        uses: actions/cache@v5.0.5
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.run_id }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nx-${{ runner.os }}-
      - name: Setup Base and SHAs for 'nx affected'
        uses: nrwl/nx-set-shas@v5.0.1
      - if: ${{ github.event_name == 'pull_request' }}
        name: Setup Main Branch Tracking
        run: git branch --track main origin/main
      - if: ${{ github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' }}
        name: Validate Commit Messages
        run: pnpm exec commitlint --from=${{ github.event.pull_request.base.sha }} --to=${{ github.event.pull_request.head.sha }}
      - name: Run Format Check
        run: pnpm exec nx format:check
      - name: Run Linting & Unit Tests
        run: pnpm exec nx affected -t lint test
      - name: Run Build
        run: pnpm exec nx affected -t build
      - if: ${{ github.event_name == 'pull_request' }}
        name: Release Config Dry Run
        run: pnpm exec nx release --dry-run --skip-publish

  release:
    needs: main
    if: ${{ github.event_name == 'push' && github.triggering_actor != 'jdwlabs-release-bot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Serialize racing merges: nx release must never push onto a moved main tip.
    concurrency:
      group: release-main
      cancel-in-progress: false
    outputs:
      matrix: ${{ steps.released.outputs.matrix }}
      sha: ${{ steps.released.outputs.sha }}
    steps:
      - name: Generate release app token
        id: release-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - name: Checkout Codebase
        uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0
          token: ${{ steps.release-token.outputs.token }}
      - name: Setup Java
        uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.2.0
      - name: Warm Gradle
        working-directory: apps/backend/usersrole
        run: ./gradlew help -q
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9
      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '22'
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Nx Release
        env:
          # Nx creates the GitHub Releases via this token after pushing tags.
          GITHUB_TOKEN: ${{ steps.release-token.outputs.token }}
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "github-actions[bot]"
          # Version against the live remote tip so tags always land on the
          # commit that becomes main (same rationale as the previous pipeline).
          git fetch origin main --tags --prune --force
          git checkout -B main origin/main
          pnpm exec nx release --skip-publish --yes
      - name: Determine Released Projects
        id: released
        run: |
          sha=$(git rev-parse HEAD)
          tags=$(git tag --points-at "$sha")
          if [ -z "$tags" ]; then
            echo "No projects released."
            matrix='[]'
          else
            matrix=$(printf '%s\n' "$tags" \
              | sed -nE 's/^(.+)-([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?)$/{"project":"\1","version":"\2"}/p' \
              | jq -sc '.')
            echo "Released: $tags"
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  deliver:
    needs: release
    if: ${{ needs.release.outputs.matrix != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.release.outputs.matrix) }}
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
    steps:
      - name: Checkout Release Commit
        uses: actions/checkout@v6.0.3
        with:
          ref: ${{ needs.release.outputs.sha }}
      - name: Setup Java
        uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.2.0
      - name: Warm Gradle
        working-directory: apps/backend/usersrole
        run: ./gradlew help -q
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9
      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '22'
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Detect Delivery Targets
        id: targets
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          targets=$(pnpm exec nx show project "$PROJECT" --json | jq -r '.targets | keys | join(" ")')
          echo "Available targets: $targets"
          for t in build-image update-app update-description; do
            case " $targets " in
              *" $t "*) echo "$t=true"  >> "$GITHUB_OUTPUT" ;;
              *)        echo "$t=false" >> "$GITHUB_OUTPUT" ;;
            esac
          done
      - if: ${{ steps.targets.outputs.build-image == 'true' }}
        name: Login to Docker Hub
        uses: docker/login-action@v4.2.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - if: ${{ steps.targets.outputs.build-image == 'true' }}
        name: Set up QEMU
        uses: docker/setup-qemu-action@v4.1.0
      - if: ${{ steps.targets.outputs.build-image == 'true' }}
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.1.0
        with:
          driver: 'docker-container'
          platforms: 'linux/amd64,linux/arm64'
      - if: ${{ steps.targets.outputs.build-image == 'true' }}
        name: Build and Push Image
        env:
          PROJECT: ${{ matrix.project }}
        run: pnpm exec nx run "$PROJECT":build-image
      - if: ${{ steps.targets.outputs.update-app == 'true' }}
        name: Update Deployments Chart
        env:
          PROJECT: ${{ matrix.project }}
          GH_APP_ID: ${{ secrets.RELEASE_APP_ID }}
          GH_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "github-actions[bot]"
          pnpm exec nx run "$PROJECT":update-app
      - if: ${{ steps.targets.outputs.update-description == 'true' }}
        name: Update Docker Hub Description
        env:
          PROJECT: ${{ matrix.project }}
        run: pnpm exec nx run "$PROJECT":update-description

  dispatch-e2e:
    needs: [release, deliver]
    if: ${{ needs.release.outputs.matrix != '[]' && needs.deliver.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate deployments dispatch token
        id: dispatch-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: deployments
          permission-contents: write
      - name: Dispatch E2E to Deployments Repo
        uses: peter-evans/repository-dispatch@v4.0.1
        with:
          token: ${{ steps.dispatch-token.outputs.token }}
          repository: jdwlabs/deployments
          event-type: apps-deployed
          client-payload: '{"sha": "${{ needs.release.outputs.sha }}"}'
