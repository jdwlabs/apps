name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  actions: write
  contents: write

# Cancel superseded PR runs; never cancel a main-push (it may be mid-release).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Ephemeral CI runners: no daemon to reuse, and a lingering daemon is what hangs
  # @nx/gradle graph creation. Run gradle one-shot.
  NX_DAEMON: 'false'
  GRADLE_OPTS: '-Dorg.gradle.daemon=false'
  # @nx/gradle generates the project graph by invoking gradle with a 120s default
  # timeout. A cold gradle (dist download + full Spring Boot dep resolution) can
  # exceed it, failing the whole graph. Raise it so a cold run can complete and
  # seed the gradle cache. The Warm Gradle step below makes the steady state fast.
  NX_GRADLE_PROJECT_GRAPH_TIMEOUT: '600'

jobs:
  main:
    runs-on: ubuntu-latest
    # Fail fast: cap runtime so a stuck/looping job can't burn the Actions budget.
    timeout-minutes: 30
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
    steps:
      - if: ${{ github.event_name != 'pull_request' }}
        name: Generate release app token
        id: release-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # Scoped to this repo: persisted by checkout for the semver commit/tag
          # push to main. The deployments push uses a separate token minted at
          # push time inside update-app.sh (see Run Version Upgrades).
      - name: Checkout Codebase
        uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0
          # On main-push, check out with the release App token so the persisted
          # git credential IS the App's — every later push (semver/postTargets)
          # authenticates as the App, a ruleset bypass actor, and isn't declined.
          # Falls back to the default token on PRs (token step is skipped there).
          token: ${{ steps.release-token.outputs.token || github.token }}
      # JDK must exist before the first nx command: @nx/gradle (apps/backend/**)
      # shells out to gradle 8.7 to build the project graph, and usersrole targets
      # Java 21. Without this, gradle stalls provisioning a toolchain — the cause
      # of the ~11-min "Failed to process project graph" hang.
      - name: Setup Java
        uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.2.0
      # Pre-warm gradle (download dist + resolve deps) so the later @nx/gradle
      # graph generation is ~1s instead of timing out cold. Seeds the gradle
      # cache; near-instant once the cache is warm.
      - name: Warm Gradle
        working-directory: apps/backend/usersrole
        run: ./gradlew help -q
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9
      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '22'
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      # Persist Nx's task cache across runs via the GitHub Actions cache. The
      # run_id suffix always writes a fresh entry; restore-keys pull the most
      # recent prior cache. GitHub scopes caches per branch, so a PR can't poison
      # main's cache (the CREEP class of issue with shared remote caches).
      - name: Restore Nx cache
        uses: actions/cache@v5.0.5
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.run_id }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nx-${{ runner.os }}-
      - name: Setup Base and SHAs for 'nx affected'
        uses: nrwl/nx-set-shas@v5.0.1
      - if: ${{ github.event_name == 'pull_request' }}
        name: Setup Main Branch Tracking
        run: git branch --track main origin/main
      - if: ${{ github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' }}
        name: Validate Commit Messages
        run: pnpm exec commitlint --from=${{ github.event.pull_request.base.sha }} --to=${{ github.event.pull_request.head.sha }}
      - name: Run Format Check
        # --all checks the whole repo, not just affected files. Without it the
        # scope tracks git context (PR diff vs push range), so a repo-wide
        # formatting violation in a file the change doesn't touch passes the PR
        # gate yet fails on main-push — a green PR no longer implies a green main.
        run: pnpm exec nx format:check --all
      - name: Run Linting & Unit Tests
        run: pnpm exec nx affected -t lint test
      - name: Run Build
        run: pnpm exec nx affected -t build
      - if: ${{ github.event_name != 'pull_request' }}
        name: Login to Docker Hub
        uses: docker/login-action@v4.2.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      # qemu.install is a kubernetes-driver option; for docker-container we
      # register binfmt handlers via setup-qemu-action so the amd64 runner can
      # cross-build linux/arm64.
      - if: ${{ github.event_name != 'pull_request' }}
        name: Set up QEMU
        uses: docker/setup-qemu-action@v4.1.0
      - if: ${{ github.event_name != 'pull_request' }}
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.1.0
        with:
          driver: 'docker-container'
          platforms: 'linux/amd64,linux/arm64'
      - if: ${{ github.event_name != 'pull_request' }}
        name: Run Version Upgrades
        env:
          # The update-app postTarget (scripts/update-app.sh) mints a fresh,
          # deployments-scoped installation token from these at push time, so a
          # long build-image step can't expire a token minted at job start.
          GH_APP_ID: ${{ secrets.RELEASE_APP_ID }}
          GH_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "github-actions[bot]"
          # Version against the live remote main tip, not the detached push SHA.
          # `git checkout -B main` alone roots HEAD at the trigger commit, which
          # can already be behind origin/main; @jscutlery/semver then cuts the tag
          # on that stale base, so the tag lands on a commit that never becomes the
          # real main tip — orphaned tags ratchet ahead of main (JDWLABS-72) and
          # the next release collides. Fetch + reset onto origin/main so HEAD ==
          # main and every semver commit/tag push fast-forwards onto the branch it
          # tagged. The push authenticates as the release App (token persisted by
          # checkout above), a ruleset bypass actor.
          git fetch origin main --tags --prune --force
          git checkout -B main origin/main
          pnpm exec nx affected -t version --parallel=1

      # Hands off post-deploy verification: the deployments repo runs
      # platform-e2e against real staging once images are published.
      - if: ${{ github.event_name != 'pull_request' }}
        name: Generate deployments dispatch token
        id: dispatch-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: deployments
          # repository_dispatch only needs contents:write — keep it least-privilege.
          permission-contents: write
      - if: ${{ github.event_name != 'pull_request' }}
        name: Dispatch E2E to Deployments Repo
        uses: peter-evans/repository-dispatch@v4.0.1
        with:
          token: ${{ steps.dispatch-token.outputs.token }}
          repository: jdwlabs/deployments
          event-type: apps-deployed
          client-payload: '{"sha": "${{ github.sha }}"}'
