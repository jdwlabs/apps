name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  actions: write
  contents: write

env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  main:
    runs-on: ubuntu-jdwlabs
    # Fail fast: a stuck/looping job otherwise runs to the 6h platform cap,
    # starving the self-hosted runner queue for other PRs.
    timeout-minutes: 30
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # This line enables distribution
      # The "--stop-agents-after" is optional, but allows idle agents to shut down once the "e2e-ci" targets have been requested
      # - name: Enable NX Cloud Distribution
      #   run: pnpm exec nx-cloud start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="build"
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Setup Base and SHAs for 'nx affected'
        uses: nrwl/nx-set-shas@v4
      - if: ${{ github.event_name == 'pull_request' }}
        name: Setup Main Branch Tracking
        run: git branch --track main origin/main
      - if: ${{ github.event_name == 'pull_request' }}
        name: Validate Commit Messages
        run: pnpm exec commitlint --from=${{ github.event.pull_request.base.sha }} --to=${{ github.event.pull_request.head.sha }}
      - name: Run Format Check
        run: pnpm exec nx-cloud record -- nx format:check
      - name: Reset NX
        run: pnpm exec nx reset
      - name: Run Linting & Unit Tests
        run: pnpm exec nx affected -t lint test
      - name: Run Build
        run: pnpm exec nx affected -t build
      - if: ${{ github.event_name != 'pull_request' }}
        name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - if: ${{ github.event_name != 'pull_request' }}
        name: Setup SSH
        uses: MrSquaare/ssh-setup-action@v3
        with:
          host: github.com
          private-key: ${{ secrets.ACTIONS_PRIVATE_KEY }}
      - if: ${{ github.event_name != 'pull_request' }}
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: 'kubernetes'
          driver-opts: |
            qemu.install=true
          platforms: 'linux/amd64,linux/arm64'
      - if: ${{ github.event_name != 'pull_request' }}
        name: Run Version Upgrades
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "github-actions[bot]"
          pnpm exec nx affected -t version --parallel=1
          git fetch origin develop
          git checkout develop
          git pull origin main --rebase
          git push --force-with-lease origin develop

      # Self-heal can loop indefinitely on a hard failure; cap it so it can't
      # consume the whole job budget.
      - run: npx nx fix-ci
        if: always()
        timeout-minutes: 10
