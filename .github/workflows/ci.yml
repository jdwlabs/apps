name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# No default permissions: release/deliver/dispatch-e2e authenticate via a
# GitHub App token (create-github-app-token), not the default GITHUB_TOKEN, so
# they don't need it. Each job below grants only what its own steps use.
permissions: {}

# Cancel superseded PR runs; a main-push always runs quality gates to completion.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Ephemeral CI runners: no daemon to reuse, and a lingering daemon is what hangs
  # @nx/gradle graph creation. Run gradle one-shot.
  NX_DAEMON: 'false'
  GRADLE_OPTS: '-Dorg.gradle.daemon=false'
  # @nx/gradle generates the project graph by invoking gradle with a 120s default
  # timeout. A cold gradle (dist download + full Spring Boot dep resolution) can
  # exceed it, failing the whole graph. Raise it so a cold run can complete and
  # seed the gradle cache. The Warm Gradle step below makes the steady state fast.
  NX_GRADLE_PROJECT_GRAPH_TIMEOUT: '600'

jobs:
  main:
    # Release postTargets push chore commits back to main authenticated as the
    # release App — those pushes DO trigger workflows (App tokens bypass the
    # GITHUB_TOKEN recursion suppression). Without this guard the pipeline
    # re-versions the just-released projects forever: the conventionalcommits
    # preset patch-bumps on any commit, including the release's own chore
    # commits — producing an endless ~5-minute release loop.
    if: ${{ github.event_name != 'push' || github.triggering_actor != 'jdwlabs-release-bot[bot]' }}
    runs-on: ubuntu-latest
    # Fail fast: cap runtime so a stuck/looping job can't burn the Actions budget.
    timeout-minutes: 30
    permissions:
      contents: read
      # actions/cache's save step (post-job) needs this to write the cache entry.
      actions: write
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          token: ${{ github.token }}
      # JDK must exist before the first nx command: @nx/gradle (apps/backend/**)
      # shells out to gradle 8.7 to build the project graph, and usersrole targets
      # Java 21. Without this, gradle stalls provisioning a toolchain — the cause
      # of the ~11-min "Failed to process project graph" hang.
      - name: Setup Java
        uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.2.0
      # Pre-warm gradle (download dist + resolve deps) so the later @nx/gradle
      # graph generation is ~1s instead of timing out cold. Seeds the gradle
      # cache; near-instant once the cache is warm.
      - name: Warm Gradle
        working-directory: apps/backend/usersrole
        run: ./gradlew help -q
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9
      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      # Persist Nx's task cache across runs via the GitHub Actions cache. The
      # run_id suffix always writes a fresh entry; restore-keys pull the most
      # recent prior cache. GitHub scopes caches per branch, so a PR can't poison
      # main's cache (the CREEP class of issue with shared remote caches).
      - name: Restore Nx cache
        uses: actions/cache@v6.1.0
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.run_id }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nx-${{ runner.os }}-
      - name: Setup Base and SHAs for 'nx affected'
        uses: nrwl/nx-set-shas@v5.0.1
      - if: ${{ github.event_name == 'pull_request' }}
        name: Setup Main Branch Tracking
        run: git branch --track main origin/main
      - if: ${{ github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' }}
        name: Validate Commit Messages
        run: pnpm exec commitlint --from=${{ github.event.pull_request.base.sha }} --to=${{ github.event.pull_request.head.sha }}
      - name: Run Format Check
        # --all checks the whole repo, not just affected files. Without it the
        # scope tracks git context (PR diff vs push range), so a repo-wide
        # formatting violation in a file the change doesn't touch passes the PR
        # gate yet fails on main-push — a green PR no longer implies a green main.
        run: pnpm exec nx format:check --all
      - name: Run Linting & Unit Tests
        run: pnpm exec nx affected -t lint test
      - name: Run Build
        run: pnpm exec nx affected -t build
      - if: ${{ github.event_name == 'pull_request' }}
        name: Release Config Dry Run
        env:
          # Dry-run still reads the GitHub API while previewing release notes;
          # unauthenticated calls from shared runner IPs get rate-limited (403).
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm exec nx release --dry-run --skip-publish

  release:
    needs: main
    if: ${{ github.event_name == 'push' && github.triggering_actor != 'jdwlabs-release-bot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Serialize racing merges: nx release must never push onto a moved main tip.
    concurrency:
      group: release-main
      cancel-in-progress: false
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.released.outputs.matrix }}
      sha: ${{ steps.released.outputs.sha }}
      # Distinguishes "nothing was released" from "detection never got there":
      # unset means the step failed, so downstream jobs stay off.
      released: ${{ steps.released.outputs.released }}
    steps:
      - name: Generate release app token
        id: release-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - name: Checkout Codebase
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.release-token.outputs.token }}
          # Don't leave the repo-write App token sitting in .git/config through
          # Java/Gradle setup and pnpm install (dependency lifecycle scripts run
          # with whatever's on disk). Re-authenticate immediately before the
          # step that actually needs to push.
          persist-credentials: false
      - name: Setup Java
        uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.2.0
      - name: Warm Gradle
        working-directory: apps/backend/usersrole
        run: ./gradlew help -q
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9
      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Authenticate Remote For Release Push
        # persist-credentials: false above kept this token off disk until now;
        # inject it right before the step that actually needs to push.
        run: |
          git remote set-url origin "https://x-access-token:${{ steps.release-token.outputs.token }}@github.com/${{ github.repository }}.git"
      - name: Map Delivery Targets
        id: targets
        # Resolve delivery targets for every project BEFORE the irreversible
        # release step. Tagging is a push; a graph lookup is fragile. Running
        # the fragile act first means a broken lookup fails the run while it is
        # still recoverable, instead of stranding tags that have no image.
        # One graph read covers every project, so there is a single place for
        # this to go wrong rather than one per released project. --silent keeps
        # pnpm's lockfile/progress chatter out of the pipe, and --file makes nx
        # write JSON instead of serving the graph UI. The graph goes to the
        # runner temp dir so it never shows up in the tree nx release commits.
        run: |
          set -euo pipefail
          graph="$RUNNER_TEMP/project-graph.json"
          pnpm --silent exec nx graph --file="$graph"
          map=$(jq -c '
            .graph.nodes
            | with_entries(
                .value = (
                  (.value.data.targets // {} | keys) as $targets
                  | {
                      "build-image": ($targets | index("build-image") != null),
                      "update-app": ($targets | index("update-app") != null),
                      "update-description": ($targets | index("update-description") != null)
                    }
                )
              )
          ' "$graph")
          count=$(jq -r 'length' <<< "$map")
          if [ "$count" -eq 0 ]; then
            echo "::error::Project graph resolved zero projects; refusing to run a release that could not be delivered"
            exit 1
          fi
          echo "Resolved delivery targets for $count projects."
          echo "map=$map" >> "$GITHUB_OUTPUT"
      - name: Run Nx Release
        env:
          # Nx creates the GitHub Releases via this token after pushing tags.
          GITHUB_TOKEN: ${{ steps.release-token.outputs.token }}
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "github-actions[bot]"
          # Version against the live remote tip so tags always land on the
          # commit that becomes main (same rationale as the previous pipeline).
          git fetch origin main --tags --prune --force
          git checkout -B main origin/main
          pnpm exec nx release --skip-publish
      - name: Determine Released Projects
        id: released
        env:
          TARGET_MAP: ${{ steps.targets.outputs.map }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          tags=$(git tag --points-at "$sha")
          if [ -z "$tags" ]; then
            echo "No projects released."
            echo "released=false" >> "$GITHUB_OUTPUT"
            matrix='[]'
          else
            echo "Released: $tags"
            projects=$(printf '%s\n' "$tags" \
              | sed -nE 's/^(.+)-([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?)$/\1 \2/p')
            # Every branch below this point must fail rather than yield an empty
            # matrix: the tags are already pushed, so a skipped deliver leaves
            # versions published with no image behind them.
            if [ -z "$projects" ]; then
              echo "::error::Tags were pushed but no project/version pair parsed out of them: ${tags//$'\n'/ }"
              exit 1
            fi
            entries='[]'
            while read -r project version; do
              [ -z "$project" ] && continue
              if ! targets=$(jq -e --arg project "$project" '.[$project]' <<< "$TARGET_MAP"); then
                echo "::error::Released project '$project' has no delivery targets in the pre-release map"
                exit 1
              fi
              entry=$(jq -nc \
                --arg project "$project" \
                --arg version "$version" \
                --argjson targets "$targets" \
                '{project: $project, version: $version} + $targets')
              entries=$(printf '%s\n%s' "$entries" "$entry" | jq -sc 'flatten')
            done <<< "$projects"
            if [ "$(jq -r 'length' <<< "$entries")" -eq 0 ]; then
              echo "::error::Tags were pushed but the deliver matrix is empty; those versions would ship with no image"
              exit 1
            fi
            echo "released=true" >> "$GITHUB_OUTPUT"
            matrix="$entries"
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  deliver:
    needs: release
    if: ${{ needs.release.outputs.released == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.release.outputs.matrix) }}
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
    steps:
      - name: Checkout Release Commit
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.release.outputs.sha }}
      - name: Setup Java
        uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.2.0
      - name: Warm Gradle
        working-directory: apps/backend/usersrole
        run: ./gradlew help -q
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9
      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      # Delivery targets (build-image/update-app/update-description) were
      # already detected once in the release job and embedded in this matrix
      # entry (matrix.build-image etc) — no need for every matrix job here to
      # redo the same `nx show project` lookup.
      - if: ${{ matrix['build-image'] == true }}
        name: Login to Docker Hub
        uses: docker/login-action@v4.2.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - if: ${{ matrix['build-image'] == true }}
        name: Set up QEMU
        uses: docker/setup-qemu-action@v4.1.0
      - if: ${{ matrix['build-image'] == true }}
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.1.0
        with:
          driver: 'docker-container'
          platforms: 'linux/amd64,linux/arm64'
      - if: ${{ matrix['build-image'] == true }}
        name: Build and Push Image
        env:
          PROJECT: ${{ matrix.project }}
        run: pnpm exec nx run "$PROJECT":build-image
      - if: ${{ matrix['update-app'] == true }}
        name: Update Deployments Chart
        env:
          PROJECT: ${{ matrix.project }}
          GH_APP_ID: ${{ secrets.RELEASE_APP_ID }}
          GH_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: pnpm exec nx run "$PROJECT":update-app
      - if: ${{ matrix['update-description'] == true }}
        name: Update Docker Hub Description
        env:
          PROJECT: ${{ matrix.project }}
        run: pnpm exec nx run "$PROJECT":update-description

  dispatch-e2e:
    needs: [release, deliver]
    if: ${{ needs.release.outputs.released == 'true' && needs.deliver.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Generate deployments dispatch token
        id: dispatch-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: deployments
          permission-contents: write
      - name: Dispatch E2E to Deployments Repo
        uses: peter-evans/repository-dispatch@v4.0.1
        with:
          token: ${{ steps.dispatch-token.outputs.token }}
          repository: jdwlabs/deployments
          event-type: apps-deployed
          client-payload: '{"sha": "${{ needs.release.outputs.sha }}"}'
