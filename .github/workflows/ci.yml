name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# No default permissions: release/deliver/dispatch-e2e authenticate via a
# GitHub App token (create-github-app-token), not the default GITHUB_TOKEN, so
# they don't need it. Each job below grants only what its own steps use.
permissions: {}

# Cancel superseded PR runs; a main-push always runs quality gates to completion.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Ephemeral CI runners: no daemon to reuse, and a lingering daemon is what hangs
  # @nx/gradle graph creation. Run gradle one-shot.
  NX_DAEMON: 'false'
  GRADLE_OPTS: '-Dorg.gradle.daemon=false'
  # @nx/gradle generates the project graph by invoking gradle with a 120s default
  # timeout. A cold gradle (dist download + full Spring Boot dep resolution) can
  # exceed it, failing the whole graph. Raise it so a cold run can complete and
  # seed the gradle cache. The Warm Gradle step below makes the steady state fast.
  NX_GRADLE_PROJECT_GRAPH_TIMEOUT: '600'

jobs:
  main:
    # Release postTargets push chore commits back to main authenticated as the
    # release App — those pushes DO trigger workflows (App tokens bypass the
    # GITHUB_TOKEN recursion suppression). Without this guard the pipeline
    # re-versions the just-released projects forever: the conventionalcommits
    # preset patch-bumps on any commit, including the release's own chore
    # commits — producing an endless ~5-minute release loop.
    if: ${{ github.event_name != 'push' || github.triggering_actor != 'jdwlabs-release-bot[bot]' }}
    runs-on: ubuntu-latest
    # Fail fast: cap runtime so a stuck/looping job can't burn the Actions budget.
    timeout-minutes: 30
    permissions:
      contents: read
      # setup-node's pnpm-store cache writes its entry in a post-job step, and
      # that save needs write access even though nothing here reads it directly.
      actions: write
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          token: ${{ github.token }}
      # JDK must exist before the first nx command: @nx/gradle (apps/backend/**)
      # shells out to gradle 8.7 to build the project graph, and usersrole targets
      # Java 21. Without this, gradle stalls provisioning a toolchain — the cause
      # of the ~11-min "Failed to process project graph" hang.
      - name: Setup Java
        uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.2.0
      # Pre-warm gradle (download dist + resolve deps) so the later @nx/gradle
      # graph generation is ~1s instead of timing out cold. Seeds the gradle
      # cache; near-instant once the cache is warm.
      - name: Warm Gradle
        working-directory: apps/backend/usersrole
        run: ./gradlew help -q
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9
      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      # Pinned from go.work rather than inherited from the runner image, which
      # drifts in both directions without a commit here: a downgrade breaks the
      # build and blames our code, an upgrade silently absorbs a language bump
      # that should have been a decision.
      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.work
      - name: Setup Base and SHAs for 'nx affected'
        uses: nrwl/nx-set-shas@v5.0.1
      - if: ${{ github.event_name == 'pull_request' }}
        name: Setup Main Branch Tracking
        run: git branch --track main origin/main
      - if: ${{ github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' }}
        name: Validate Commit Messages
        run: pnpm exec commitlint --from=${{ github.event.pull_request.base.sha }} --to=${{ github.event.pull_request.head.sha }}
      - name: Run Format Check
        # --all checks the whole repo, not just affected files. Without it the
        # scope tracks git context (PR diff vs push range), so a repo-wide
        # formatting violation in a file the change doesn't touch passes the PR
        # gate yet fails on main-push — a green PR no longer implies a green main.
        run: pnpm exec nx format:check --all
      - name: Run Linting & Unit Tests
        run: pnpm exec nx affected -t lint test
      - name: Run Build
        run: pnpm exec nx affected -t build
      - if: ${{ github.event_name == 'pull_request' }}
        name: Release Config Dry Run
        env:
          # Dry-run still reads the GitHub API while previewing release notes;
          # unauthenticated calls from shared runner IPs get rate-limited (403).
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm exec nx release --dry-run --skip-publish

  # Runs the module-federation contract. The suite is the only surface covering
  # it, and it has broken production twice with every probe green. It sits in
  # its own job rather than inside `main` so it overlaps the quality gates
  # instead of queueing behind them, and it fans out over a matrix so the wall
  # time is one shard's worth rather than the whole suite's.
  #
  # No `if:` guard here on purpose. `nx affected` inside the job is the only
  # thing allowed to decide the suite does not apply, because it reads the same
  # project graph the suite is defined by. A guard expressed as changed-path
  # globs or a shell pre-check would be a second, weaker copy of that decision
  # that can only fail one way — a broken check reads as "not affected" and the
  # gate skips silently, which is the failure this gate exists to stop.
  e2e-shard:
    if: ${{ github.event_name != 'push' || github.triggering_actor != 'jdwlabs-release-bot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # setup-node's pnpm-store cache writes its entry in a post-job step, and
      # that save needs write access even though nothing here reads it directly.
      actions: write
    strategy:
      # Every shard reports its own failures. Stopping the siblings on the first
      # red would hide the rest of the suite behind whichever shard lost the
      # race, turning one broken spec into an unknown number of them.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          token: ${{ github.token }}
      # JDK must exist before the first nx command: @nx/gradle (apps/backend/**)
      # shells out to gradle 8.7 to build the project graph, and usersrole targets
      # Java 21. Without this, gradle stalls provisioning a toolchain — the cause
      # of the ~11-min "Failed to process project graph" hang.
      - name: Setup Java
        uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.2.0
      - name: Warm Gradle
        working-directory: apps/backend/usersrole
        run: ./gradlew help -q
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9
      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Setup Base and SHAs for 'nx affected'
        uses: nrwl/nx-set-shas@v5.0.1
      - if: ${{ github.event_name == 'pull_request' }}
        name: Setup Main Branch Tracking
        run: git branch --track main origin/main
      # The runner image ships no Playwright browsers and the e2e target sets
      # skipInstall, so the suite would have nothing to launch. Only chromium is
      # fetched because playwright.config.ts declares that single project.
      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium
      # `affected` keeps this off backend- and docs-only changes: platform-e2e
      # declares the four frontends as implicit dependencies, so a Go-only diff
      # resolves to the Go project alone and no shard runs a test.
      #
      # The shard total comes from strategy.job-total rather than a literal so
      # resizing the matrix above cannot leave a stale divisor behind, which
      # would silently drop whole slices of the suite while every shard stays
      # green.
      - name: Run E2E Shard
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_TOTAL: ${{ strategy.job-total }}
        run: pnpm exec nx affected -t e2e --shard="$SHARD_INDEX/$SHARD_TOTAL"
      # The nx playwright preset already emits a blob report under CI, named
      # report-<shard>.zip once --shard is set. Uploaded even on failure: a red
      # shard is exactly when the merged report is worth reading.
      - if: ${{ !cancelled() }}
        name: Upload Shard Blob Report
        uses: actions/upload-artifact@v7.0.1
        with:
          name: platform-e2e-blob-${{ matrix.shard }}
          path: dist/.playwright/apps/e2e/platform-e2e/blob-report
          # A shard that ran no tests writes no blob. That is the expected shape
          # of a backend-only change, not an error.
          if-no-files-found: ignore
          retention-days: 7

  # The single aggregate verdict for the sharded suite, and the only e2e context
  # branch protection should require. Requiring the shards themselves would pin
  # protection to the matrix size, so resizing it would strand a required check
  # that never reports again.
  #
  # `!cancelled()` rather than a condition on the shards' outcome: this job has
  # to report on every run it is capable of reporting on, because a required
  # check that never reports blocks the branch forever. The release-bot clause
  # is the same guard the shards carry so the two skip together; it collapses to
  # `true` on pull_request, so it can never withhold the check from a PR.
  #
  # It reads the matrix outcome and nothing else — no checkout, no install, no
  # network. Every extra thing a required check does is another way for it to go
  # red for a reason unrelated to the tests, and "the artifact download flaked"
  # costs a reviewer the same investigation as a real failure. Merging the
  # reports is a separate job for exactly that reason.
  e2e:
    needs: e2e-shard
    if: ${{ !cancelled() && (github.event_name != 'push' || github.triggering_actor != 'jdwlabs-release-bot[bot]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Verify Shard Outcome
        env:
          SHARD_OUTCOME: ${{ needs.e2e-shard.result }}
        run: |
          set -euo pipefail
          echo "shard matrix outcome: $SHARD_OUTCOME"
          # Success is the only passing value. 'skipped' and 'cancelled' both
          # mean no shard ever produced a verdict, and either one read as a pass
          # turns this gate into a rubber stamp that green-lights an unrun suite.
          if [ "$SHARD_OUTCOME" != "success" ]; then
            echo "::error::platform-e2e shards did not all succeed (matrix outcome: $SHARD_OUTCOME)"
            exit 1
          fi
          echo "All platform-e2e shards passed."

  # Folds the per-shard blob reports into one browsable report, so a sharded run
  # reads as a single suite rather than N partial ones. Kept out of the gate
  # above on purpose — this job exists to explain a result, never to decide it,
  # so nothing here can turn a passing suite red.
  e2e-report:
    needs: e2e-shard
    if: ${{ !cancelled() && (github.event_name != 'push' || github.triggering_actor != 'jdwlabs-release-bot[bot]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Reading another job's artifacts goes through the Actions API, and
      # setup-node's pnpm-store cache saves in a post-job step.
      actions: write
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v7.0.1
        with:
          token: ${{ github.token }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9
      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Download Shard Blob Reports
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: platform-e2e-blob-*
          merge-multiple: true
          path: blob-reports
      - name: Merge Shard Reports
        run: |
          set -euo pipefail
          shopt -s nullglob
          blobs=(blob-reports/*.zip)
          echo "shards reporting: ${#blobs[@]}"
          if [ "${#blobs[@]}" -eq 0 ]; then
            echo "No blob reports were produced; the suite was not affected by this change."
            exit 0
          fi
          pnpm exec playwright merge-reports --reporter=html blob-reports
      - if: ${{ hashFiles('playwright-report/**') != '' }}
        name: Upload Merged Report
        uses: actions/upload-artifact@v7.0.1
        with:
          name: platform-e2e-report
          path: playwright-report
          retention-days: 7

  release:
    needs: [main, e2e]
    if: ${{ github.event_name == 'push' && github.triggering_actor != 'jdwlabs-release-bot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Serialize racing merges: nx release must never push onto a moved main tip.
    concurrency:
      group: release-main
      cancel-in-progress: false
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.released.outputs.matrix }}
      sha: ${{ steps.released.outputs.sha }}
      # Distinguishes "nothing was released" from "detection never got there":
      # unset means the step failed, so downstream jobs stay off.
      released: ${{ steps.released.outputs.released }}
    steps:
      - name: Generate release app token
        id: release-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - name: Checkout Codebase
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.release-token.outputs.token }}
          # Don't leave the repo-write App token sitting in .git/config through
          # Java/Gradle setup and pnpm install (dependency lifecycle scripts run
          # with whatever's on disk). Re-authenticate immediately before the
          # step that actually needs to push.
          persist-credentials: false
      - name: Setup Java
        uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.2.0
      - name: Warm Gradle
        working-directory: apps/backend/usersrole
        run: ./gradlew help -q
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9
      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Authenticate Remote For Release Push
        # persist-credentials: false above kept this token off disk until now;
        # inject it right before the step that actually needs to push.
        run: |
          git remote set-url origin "https://x-access-token:${{ steps.release-token.outputs.token }}@github.com/${{ github.repository }}.git"
      - name: Map Delivery Targets
        id: targets
        # Resolve delivery targets for every project BEFORE the irreversible
        # release step. Tagging is a push; a graph lookup is fragile. Running
        # the fragile act first means a broken lookup fails the run while it is
        # still recoverable, instead of stranding tags that have no image.
        # One graph read covers every project, so there is a single place for
        # this to go wrong rather than one per released project. --silent keeps
        # pnpm's lockfile/progress chatter out of the pipe, and --file makes nx
        # write JSON instead of serving the graph UI. The graph goes to the
        # runner temp dir so it never shows up in the tree nx release commits.
        run: |
          set -euo pipefail
          graph="$RUNNER_TEMP/project-graph.json"
          pnpm --silent exec nx graph --file="$graph"
          map=$(jq -c '
            .graph.nodes
            | with_entries(
                .value = (
                  (.value.data.targets // {} | keys) as $targets
                  | {
                      "build-image": ($targets | index("build-image") != null),
                      "update-app": ($targets | index("update-app") != null),
                      "update-description": ($targets | index("update-description") != null)
                    }
                )
              )
          ' "$graph")
          count=$(jq -r 'length' <<< "$map")
          if [ "$count" -eq 0 ]; then
            echo "::error::Project graph resolved zero projects; refusing to run a release that could not be delivered"
            exit 1
          fi
          echo "Resolved delivery targets for $count projects."
          echo "map=$map" >> "$GITHUB_OUTPUT"
      - name: Run Nx Release
        env:
          # Nx creates the GitHub Releases via this token after pushing tags.
          GITHUB_TOKEN: ${{ steps.release-token.outputs.token }}
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "github-actions[bot]"
          # Version against the live remote tip so tags always land on the
          # commit that becomes main (same rationale as the previous pipeline).
          git fetch origin main --tags --prune --force
          git checkout -B main origin/main
          pnpm exec nx release --skip-publish
      - name: Determine Released Projects
        id: released
        env:
          TARGET_MAP: ${{ steps.targets.outputs.map }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          tags=$(git tag --points-at "$sha")
          if [ -z "$tags" ]; then
            echo "No projects released."
            echo "released=false" >> "$GITHUB_OUTPUT"
            matrix='[]'
          else
            echo "Released: $tags"
            projects=$(printf '%s\n' "$tags" \
              | sed -nE 's/^(.+)-([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?)$/\1 \2/p')
            # Every branch below this point must fail rather than yield an empty
            # matrix: the tags are already pushed, so a skipped deliver leaves
            # versions published with no image behind them.
            if [ -z "$projects" ]; then
              echo "::error::Tags were pushed but no project/version pair parsed out of them: ${tags//$'\n'/ }"
              exit 1
            fi
            entries='[]'
            while read -r project version; do
              [ -z "$project" ] && continue
              if ! targets=$(jq -e --arg project "$project" '.[$project]' <<< "$TARGET_MAP"); then
                echo "::error::Released project '$project' has no delivery targets in the pre-release map"
                exit 1
              fi
              entry=$(jq -nc \
                --arg project "$project" \
                --arg version "$version" \
                --argjson targets "$targets" \
                '{project: $project, version: $version} + $targets')
              entries=$(printf '%s\n%s' "$entries" "$entry" | jq -sc 'flatten')
            done <<< "$projects"
            if [ "$(jq -r 'length' <<< "$entries")" -eq 0 ]; then
              echo "::error::Tags were pushed but the deliver matrix is empty; those versions would ship with no image"
              exit 1
            fi
            echo "released=true" >> "$GITHUB_OUTPUT"
            matrix="$entries"
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  deliver:
    needs: release
    if: ${{ needs.release.outputs.released == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.release.outputs.matrix) }}
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
    steps:
      - name: Checkout Release Commit
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.release.outputs.sha }}
      - name: Setup Java
        uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.2.0
      - name: Warm Gradle
        working-directory: apps/backend/usersrole
        run: ./gradlew help -q
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9
      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      # build-image dependsOn build, so this job compiles Go as well as the main
      # job does. Same pin, same reason.
      - if: ${{ matrix['build-image'] == true }}
        name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.work
      # Delivery targets (build-image/update-app/update-description) were
      # already detected once in the release job and embedded in this matrix
      # entry (matrix.build-image etc) — no need for every matrix job here to
      # redo the same `nx show project` lookup.
      - if: ${{ matrix['build-image'] == true }}
        name: Login to Docker Hub
        uses: docker/login-action@v4.2.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - if: ${{ matrix['build-image'] == true }}
        name: Set up QEMU
        uses: docker/setup-qemu-action@v4.1.0
      - if: ${{ matrix['build-image'] == true }}
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.1.0
        with:
          driver: 'docker-container'
          platforms: 'linux/amd64,linux/arm64'
      - if: ${{ matrix['build-image'] == true }}
        name: Build and Push Image
        env:
          PROJECT: ${{ matrix.project }}
        run: pnpm exec nx run "$PROJECT":build-image
      - if: ${{ matrix['update-app'] == true }}
        name: Update Deployments Chart
        env:
          PROJECT: ${{ matrix.project }}
          GH_APP_ID: ${{ secrets.RELEASE_APP_ID }}
          GH_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: pnpm exec nx run "$PROJECT":update-app
      - if: ${{ matrix['update-description'] == true }}
        name: Update Docker Hub Description
        env:
          PROJECT: ${{ matrix.project }}
        run: pnpm exec nx run "$PROJECT":update-description

  dispatch-e2e:
    needs: [release, deliver]
    if: ${{ needs.release.outputs.released == 'true' && needs.deliver.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Generate deployments dispatch token
        id: dispatch-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: deployments
          permission-contents: write
      - name: Dispatch E2E to Deployments Repo
        uses: peter-evans/repository-dispatch@v4.0.1
        with:
          token: ${{ steps.dispatch-token.outputs.token }}
          repository: jdwlabs/deployments
          event-type: apps-deployed
          client-payload: '{"sha": "${{ needs.release.outputs.sha }}"}'
