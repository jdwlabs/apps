name: Backfill UI images to jdwlabs namespace

# One-shot manual backfill. The Nx affected-only build never republished the
# four UI apps under jdwlabs/* (they were unchanged since the namespace switch),
# so their charts in deployments/ would ImagePullBackOff once repointed.
# imagetools does a registry-to-registry manifest copy: no rebuild, no layer
# pull/push, source digests preserved. Pairs default to the tags currently
# deployed in jdwlabs-prd/non; override to backfill other tags later.
on:
  workflow_dispatch:
    inputs:
      pairs:
        description: 'Space-separated app:tag list copied jdwillmsen/jdw-<app> -> jdwlabs/<app>'
        required: true
        default: 'authui:2.0.1 container:1.4.1 rolesui:0.5.4 usersui:1.3.5'

# Job authenticates to Docker Hub via secrets and never touches GITHUB_TOKEN.
permissions: {}

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v4.4.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Copy images
        run: |
          set -euo pipefail
          for pair in ${{ inputs.pairs }}; do
            app="${pair%%:*}"
            tag="${pair##*:}"
            src="jdwillmsen/jdw-${app}:${tag}"
            dst="jdwlabs/${app}:${tag}"
            echo "::group::${src} -> ${dst}"
            docker buildx imagetools create -t "${dst}" "${src}"
            docker buildx imagetools inspect "${dst}" --format '{{.Manifest.Digest}}'
            echo "::endgroup::"
          done
