name: Deliver Backfill

# Rebuilds and publishes versions that were tagged but never delivered.
#
# The release job versions, tags and pushes before it works out its deliver
# matrix, so any failure in between leaves a version recorded in git with no
# image behind it. `nx release` will not re-tag those versions, and the CI
# release job only runs on push, so nothing reaches them again on its own.
#
# Each pair is built from its own release tag, so the code the build-image and
# update-app targets compile is the one that shipped with that release - the
# published image matches the tag rather than current main.
on:
  workflow_dispatch:
    inputs:
      pairs:
        description: 'Space-separated project:version list, e.g. "container:2.0.2 authui:2.0.2 servicediscovery:1.0.1"'
        required: true
      skip-update-app:
        description: 'Skip the deployments chart bump (publish images only)'
        type: boolean
        default: false

permissions: {}

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.parse.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Parse and validate pairs
        id: parse
        env:
          PAIRS: ${{ inputs.pairs }}
        run: |
          set -euo pipefail
          entries='[]'
          for pair in $PAIRS; do
            project="${pair%%:*}"
            version="${pair##*:}"
            if [ "$project" = "$pair" ] || [ -z "$project" ] || [ -z "$version" ]; then
              echo "::error::Malformed pair '$pair' - expected project:version"
              exit 1
            fi
            tag="${project}-${version}"
            # Refuse to invent history: only an existing release tag is a valid
            # backfill target, otherwise this would publish an image for a
            # version that was never released.
            if ! git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              echo "::error::No release tag ${tag} - backfill only republishes versions that were already tagged"
              exit 1
            fi
            entry=$(jq -nc --arg project "$project" --arg version "$version" --arg tag "$tag" \
              '{project: $project, version: $version, tag: $tag}')
            entries=$(printf '%s\n%s' "$entries" "$entry" | jq -sc 'flatten')
          done
          if [ "$(jq 'length' <<<"$entries")" -eq 0 ]; then
            echo "::error::No pairs supplied"
            exit 1
          fi
          echo "Backfilling: $(jq -r '[.[].tag] | join(", ")' <<<"$entries")"
          echo "matrix=$entries" >> "$GITHUB_OUTPUT"

  backfill:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # Serialised: update-app pushes a chart bump to the deployments repo, and
      # parallel jobs would race each other onto a moving tip.
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
    steps:
      - name: Checkout Release Tag
        uses: actions/checkout@v7.0.1
        with:
          ref: refs/tags/${{ matrix.tag }}
      - name: Setup Java
        uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.2.0
      - name: Warm Gradle
        working-directory: apps/backend/usersrole
        run: ./gradlew help -q
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9
      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Detect Delivery Targets
        id: targets
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          set -euo pipefail
          # --silent keeps pnpm's own lockfile/progress chatter off stdout;
          # without it that text lands in the pipe ahead of the JSON and jq
          # aborts. Same failure that stranded these versions in the first place.
          available=$(pnpm --silent exec nx show project "$PROJECT" --json | jq -r '.targets | keys | join(" ")')
          echo "Targets: $available"
          for target in build-image update-app update-description; do
            case " $available " in
              *" $target "*) present=true ;;
              *) present=false ;;
            esac
            echo "${target//-/_}=$present" >> "$GITHUB_OUTPUT"
          done
      - name: Verify Version Matches Tag
        env:
          PROJECT: ${{ matrix.project }}
          EXPECTED: ${{ matrix.version }}
          TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail
          root=$(pnpm --silent exec nx show project "$PROJECT" --json | jq -r '.root')
          # Tags cut before versions moved into git carry a VERSION manifest —
          # Angular apps under public/, backend and database apps at the project
          # root. Where one records a released version it must still agree with
          # the tag, or the published image would carry a version the tag does
          # not describe.
          #
          # Since the move there is nothing to disagree with. Backend and
          # database apps have no manifest at all. The Angular apps still track
          # public/VERSION, but it holds a development placeholder that only an
          # image build ever stamps, so at any tag it reads the placeholder and
          # records no version. Rejecting that would break backfill for exactly
          # the projects it exists to recover. Either way the tag being checked
          # out is itself the version, and RELEASE_VERSION below carries it into
          # the targets.
          placeholder=0.0.0-dev
          file=""
          for candidate in "$root/public/VERSION" "$root/VERSION"; do
            [ -f "$candidate" ] && file="$candidate" && break
          done
          if [ -z "$file" ]; then
            echo "No version manifest under $root; $TAG is the version."
            exit 0
          fi
          actual=$(tr -d '[:space:]' < "$file")
          if [ "$actual" = "$placeholder" ]; then
            echo "$file holds the $placeholder placeholder; $TAG is the version."
            exit 0
          fi
          if [ "$actual" != "$EXPECTED" ]; then
            echo "::error::$file reads $actual at tag $TAG, expected $EXPECTED"
            exit 1
          fi
          echo "$file = $actual"
      - if: ${{ steps.targets.outputs.build_image == 'true' }}
        name: Login to Docker Hub
        uses: docker/login-action@v4.2.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - if: ${{ steps.targets.outputs.build_image == 'true' }}
        name: Set up QEMU
        uses: docker/setup-qemu-action@v4.1.0
      - if: ${{ steps.targets.outputs.build_image == 'true' }}
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.1.0
        with:
          driver: 'docker-container'
          platforms: 'linux/amd64,linux/arm64'
      - if: ${{ steps.targets.outputs.build_image == 'true' }}
        name: Build and Push Image
        env:
          PROJECT: ${{ matrix.project }}
          RELEASE_VERSION: ${{ matrix.version }}
        run: pnpm exec nx run "$PROJECT":build-image
      - if: ${{ steps.targets.outputs.update_app == 'true' && !inputs.skip-update-app }}
        name: Update Deployments Chart
        env:
          PROJECT: ${{ matrix.project }}
          RELEASE_VERSION: ${{ matrix.version }}
          GH_APP_ID: ${{ secrets.RELEASE_APP_ID }}
          GH_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "github-actions[bot]"
          pnpm exec nx run "$PROJECT":update-app
      - if: ${{ steps.targets.outputs.update_description == 'true' }}
        name: Update Docker Hub Description
        env:
          PROJECT: ${{ matrix.project }}
        run: pnpm exec nx run "$PROJECT":update-description
